[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    live: opt-in live integration tests
    live_windows: read-only Windows live smoke tests
    live_server: read-only Ubuntu SSH live smoke tests
    live_docker: read-only Docker live smoke tests
    live_mikrotik: read-only RouterOS live smoke tests
    live_homeassistant: read-only Home Assistant live smoke tests
    live_homelab: read-only homelab observability live smoke tests
