name: MCP CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-smoke:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run offline pytest smoke tests
        run: python -m pytest

      - name: Audit MCP control plane
        run: python skills/mcp-control-plane-audit/scripts/audit_control_plane.py --root . --config config.example.toml --fail-on medium

      - name: Compile MCP entrypoints
        run: >
          python -m py_compile
          agent_orchestrator.py codex_memory.py codex_workers.py memory_mcp.py workers_mcp.py
          mcp_contracts.py mcp_extensions.py mcp_observability.py mcp_runtime.py
          server.py docker_mcp.py homelab_mcp.py mikrotik_mcp.py homeassistant_mcp.py
          tunnel_mcp.py windows_system_mcp.py windows_gui_mcp.py comfy_mcp.py steamdeck_mcp.py
          mailru_imap.py mailru_mcp.py

      - name: Run MCP 2026-07-28 stateless conformance
        shell: pwsh
        run: .\scripts\run_mcp_conformance.ps1 -Python python
